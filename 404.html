<!DOCTYPE html>
<!--
欢迎使用noodUI 此UI非常简洁 非常适合个人介绍网站 目前已开源至GitHub 相信你就是从GitHub上面拉下来的吧
下面的代码基本上都打了注释 你可以根据注释改成你想要的样子 下面会有提示你该改哪里 如果你不动样式 那注释就没问题 你要是动样式 那...
此源码是nood写了半年网页才写出来的东西 真的努力了 对了 你改完需要改的东西以后 记得把这些注释都删掉
GitHub: https://github.com/noodultra/noodUI
演示站: https://noodui.nood.icu
-->
<!--index.html 主页/索引-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--下方是网站标题 你需要改成你喜欢的-->
    <title>noodUI</title>
    <!--下方是网站图标 你需要改成你喜欢的 如果你连带favicon.ico一起拉下来的话 你需要在根目录删除favicon.ico 然后换成自己喜欢的-->
    <link rel="icon" href="./favicon.ico">
    <style>
        /* 全局设置 默认深色模式 通过按钮切换模式 */
        :root {
            --bg: linear-gradient(135deg, #1e1f2a 0%, #2a2d3e 50%, #383c52 100%);
            --card: rgba(255, 255, 255, 0.05);
            --text: pink;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --blur: blur(12px);
            --radius: 14px;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            /* 下面这里是超链接渐变色 */
            --cyan: linear-gradient(90deg, #36d1dc, #5b86e5);
        }
        /* 浅色模式 */
        [data-theme="light"] {
            --bg: linear-gradient(135deg, lightblue 0%, lavender 50%, pink 100%);
            --card: rgba(255, 255, 255, 0.15);
            --text: #333;
        }
        /* 全局样式 */
        body {
            color: var(--text);
            background: var(--bg);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            transition: background-color 0.3s ease;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        /* 链接渐变色 */
        a {
            background: var(--cyan);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
        }

        /* 卡片悬浮效果 */
        a:hover {
            text-decoration: underline;
        }
        .hover {
            transition: transform 0.3s var(--ease), box-shadow 0.3s ease;
        }
        .hover:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        /* 标题栏 */
        .title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card);
            backdrop-filter: var(--blur);
            border-radius: var(--radius);
            padding: 12px 16px;
            gap: 10px;
        }
        .title-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        /* 标题栏头像 */
        .title-left-avatar {
            width: 32px;
            height: 32px;
            object-fit: cover;
        }
        .title-left-title {
            margin: 0;
            font-size: 1.3rem;
        }
        .title-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* 标题栏深浅色切换胶囊按钮(带太阳/月亮图标) */
        .theme-toggle {
            position: relative;
            width: 60px;
            height: 28px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px;
            cursor: pointer;
            border: none;
            outline: none;
            box-sizing: border-box;
        }
        .toggle-icon {
            font-size: 14px;
            line-height: 1;
            z-index: 1;
            pointer-events: none;
        }
        .toggle-slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 24px;
            height: 24px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        /* 浅色模式下滑块移动到右侧(覆盖太阳) */
        [data-theme="light"] .toggle-slider {
            transform: translateX(30px);
        }
        /* 不同主题下胶囊背景微调 */
        [data-theme="dark"] .theme-toggle {
            background-color: rgba(255, 255, 255, 0.25);
        }
        [data-theme="light"] .theme-toggle {
            background-color: rgba(0, 0, 0, 0.15);
        }

        /* 导航栏 */
        .nav {
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--card);
            backdrop-filter: var(--blur);
            border-radius: var(--radius);
            padding: 12px 16px;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* 卡片盒子 */
        .box {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
            justify-content: center;
        }
        /*卡片*/
        .box-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background: var(--card);
            backdrop-filter: var(--blur);
            border-radius: var(--radius);
            padding: 16px;
            gap: 12px;
            width: 256px;
            height: 256px;
            text-align: center;
        }
        .box-card p {
            margin: 0;
            line-height: 1.5;
        }

        /* 版权声明 */
        .copyright {
            text-align: center;
            padding: 30px 20px 20px;
            color: var(--text);
            opacity: 0.7;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- 标题 -->
    <div class="title hover">
        <div class="title-left">
            <!-- 这下面是标题栏头像 你可以引用外部链接 也可以把你的放在根目录 -->
            <img class="title-left-avatar" alt="头像" src="https://nood.icu/nood/nood-1200-nobg.png">
            <!-- 这下面是标题栏标题 你可以改成你喜欢的 -->
            <h3 class="title-left-title">面缶の网站</h3>
        </div>
        <div class="title-actions">
            <!-- 深浅色切换胶囊(带月亮和太阳图标) -->
            <button id="id-theme-toggle" class="theme-toggle" aria-label="切换深色/浅色模式">
                <span class="toggle-icon">🌙</span>
                <span class="toggle-icon">☀️</span>
                <div class="toggle-slider"></div>
            </button>
        </div>
    </div>

    <!-- 导航栏 -->
    <div class="nav hover">
        <!-- 这下面每一行a标签里面的都是一个导航栏的按钮超链接 你可以把超链接换成你喜欢的 -->
        <a href="./index.html" target="_blank">主页</a>
        <a href="./404.html" target="_blank">404</a>
    </div>

    <!-- 卡片 -->
    <div class="box">
        <!-- 下面每一个div代表一个卡片 你可以把卡片换成你喜欢的
        但是由于这里是404页面 所以不建议你更改
        -->
        <div class="box-card hover">
            <h3>404 - 页面未找到</h3>
            <p>你访问的页面不存在 你可以<a href="./index.html">返回主页</a></p>
        </div>
    </div>

    <!-- 版权声明 -->
    <div class="copyright">
        <!-- 这里可以把下面的面缶换成你的名字 -->
        <p>powered by <a href="https://noodui.nood.icu">noodUI</a>v1.1.0 © 2026 面缶.版权所有.</p>
    </div>

    <script>
        (function() {
            // 默认深色模式
            document.documentElement.dataset.theme = 'dark';

            // 深浅色切换按钮逻辑
            const themeToggle = document.getElementById('id-theme-toggle');
            if (themeToggle) {
                themeToggle.addEventListener('click', () => {
                    const currentTheme = document.documentElement.dataset.theme;
                    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                    document.documentElement.dataset.theme = newTheme;
                });
            }

            // 渐入动画
            const animatedSelectors = ['.title', '.nav', '.box'];
            const animatedElements = document.querySelectorAll(animatedSelectors.join(','));
            animatedElements.forEach(el => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                el.style.transition = 'opacity 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94), transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            });
            animatedElements.forEach((el, index) => {
                setTimeout(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, index * 100);
            });

            // 卡片悬浮(hover)效果
            document.querySelectorAll('.hover').forEach(el => {
                if (!el.style.transition) {
                    el.style.transition = 'transform 0.3s var(--ease), box-shadow 0.3s ease';
                }
            });
        })();

        // 爱心点击效果
        (function() {
            const CONFIG = {
                WIDTH: 10,
                OFFSET: 5,
                SCALE_STEP: 0.004,
                ALPHA_STEP: 0.013,
                Y_SPEED: 1
            };

            let activeHearts = [];

            function getRandomColor() {
                const r = Math.floor(Math.random() * 256);
                const g = Math.floor(Math.random() * 256);
                const b = Math.floor(Math.random() * 256);
                return `rgb(${r}, ${g}, ${b})`;
            }

            function injectStyles(cssText) {
                const styleElement = document.createElement('style');
                styleElement.type = 'text/css';
                
                try {
                    styleElement.appendChild(document.createTextNode(cssText));
                } catch (err) {
                    styleElement.styleSheet.cssText = cssText;
                }
                
                document.head.appendChild(styleElement);
            }

            function createHeartElement(x, y, color) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                
                heart.style.left = (x - CONFIG.OFFSET) + 'px';
                heart.style.top = (y - CONFIG.OFFSET) + 'px';
                heart.style.backgroundColor = color;
                heart.style.opacity = '1';
                heart.style.transform = `scale(1) rotate(45deg)`;
                
                return heart;
            }

            function addHeart(event) {
                const x = event.clientX;
                const y = event.clientY;
                const color = getRandomColor();
                const heartElement = createHeartElement(x, y, color);
                
                document.body.appendChild(heartElement);
                
                activeHearts.push({
                    element: heartElement,
                    x: x - CONFIG.OFFSET,
                    y: y - CONFIG.OFFSET,
                    scale: 1,
                    alpha: 1,
                    color: color
                });
            }

            function animateHearts() {
                for (let i = activeHearts.length - 1; i >= 0; i--) {
                    const heart = activeHearts[i];
                    
                    heart.y -= CONFIG.Y_SPEED;
                    heart.scale += CONFIG.SCALE_STEP;
                    heart.alpha -= CONFIG.ALPHA_STEP;
                    
                    if (heart.alpha <= 0) {
                        heart.element.remove();
                        activeHearts.splice(i, 1);
                        continue;
                    }
                    
                    heart.element.style.top = heart.y + 'px';
                    heart.element.style.opacity = heart.alpha;
                    heart.element.style.transform = `scale(${heart.scale}) rotate(45deg)`;
                }
                
                requestAnimationFrame(animateHearts);
            }

            function setupClickHandler() {
                const originalOnClick = window.onclick;
                
                window.onclick = function(event) {
                    if (typeof originalOnClick === 'function') {
                        originalOnClick(event);
                    }
                    
                    addHeart(event);
                };
            }

            function initHeartEffect() {
                const heartStyles = `
                    .heart {
                        width: ${CONFIG.WIDTH}px;
                        height: ${CONFIG.WIDTH}px;
                        position: fixed;
                        background: #f00;
                        transform: rotate(45deg);
                        z-index: 99999;
                        pointer-events: none;
                    }
                    .heart::before,
                    .heart::after {
                        content: '';
                        width: inherit;
                        height: inherit;
                        background: inherit;
                        border-radius: 50%;
                        position: absolute;
                    }
                    .heart::after {
                        top: -${CONFIG.OFFSET}px;
                    }
                    .heart::before {
                        left: -${CONFIG.OFFSET}px;
                    }
                `;
                
                injectStyles(heartStyles);
                setupClickHandler();
                animateHearts();
            }
            
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initHeartEffect);
            } else {
                initHeartEffect();
            }
        })();

    </script>
</body>
</html>
